# fly.toml app configuration file generated for track-spotify on 2026-07-25T19:55:42Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'track-spotify'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[mounts]
  source = 'spotify_track_data'
  destination = '/app/instance'
